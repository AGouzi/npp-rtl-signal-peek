[rtl]
nodeExe=node.exe
queryScript=js\query.js
; sourceRoot 是可选的固定搜索根，多个目录用英文分号分隔；
; 当前文件不在这些根下时会按文件位置自动识别范围，无需修改本项。
; 下面的范围参数也可以从 Notepad++ 菜单“插件 -> RTL Signal Peek -> RTL: 参数设置...”修改。
sourceRoot=demo\rtl
netgraphDir=demo\netgraph
netgraphSourceRoot=demo\rtl
topModule=demo_top
clickModifier=Ctrl

; 查询范围：从当前文件目录起，最多向上 upLevels 层；
; 遇到 Desktop、用户目录、盘符根目录会自动停止。
upLevels=2

; 向下递归层数，8 层通常足够。
downLevels=8

; 候选范围最多索引多少个 RTL 文件；超过预算会退回上一层。
maxFiles=2000

; 模块索引时间预算（毫秒）；超时返回部分结果。
maxIndexMs=2000

; 额外跳过的目录名或绝对路径，分号分隔。
excludeDirs=archive;backup;doc;ai_output;.Xil
